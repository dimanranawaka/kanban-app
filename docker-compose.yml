version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - kanban_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - KANBAN_DB_PATH=/app/data/kanban.db
      - AUTH_SECRET=${AUTH_SECRET:-dev-docker-secret-change-me}
    env_file:
      - .env
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  kanban_data:
